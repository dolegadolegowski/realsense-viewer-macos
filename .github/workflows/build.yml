# Builds RealSense Viewer for Apple Silicon (macOS 27+) and publishes the DMG.
# Runs on demand and for version tags only - macOS runner minutes are expensive.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: xcode-27          # macOS 27 "Golden Gate", Apple Silicon, Xcode 27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build
        run: scripts/build.sh

      - name: Package
        run: scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: RealSense-Viewer-macOS-arm64
          path: dist/*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "RealSense Viewer for Apple Silicon macOS 27+"
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
