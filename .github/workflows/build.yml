# Builds RealSense Viewer for Apple Silicon (macOS 27+) and attaches the DMG to a release.
# Runs on demand only (Actions > build > Run workflow) - macOS runner minutes are expensive.
name: build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach the DMG to (optional)'
        required: false

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: xcode-27          # macOS 27 "Golden Gate", Apple Silicon, Xcode 27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build
        run: scripts/build.sh

      # Host tests of the camera service kit (macos/broker): no camera, no root, nothing is installed
      - name: Test the camera service
        run: |
          build/usbd/rs-usbd-tests
          macos/broker/tests/test-camera-access.sh build/Release/realsense-usbd

      - name: Package
        run: scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: RealSense-Viewer-macOS-arm64
          path: dist/*.dmg

      - name: Attach to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}   # passed via env, never interpolated into the script
        run: gh release upload "$RELEASE_TAG" dist/*.dmg --clobber
